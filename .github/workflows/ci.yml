name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio vcrpy
      - name: Run tests
        run: pytest -q
        env:
          OPENAI_API_KEY: ""
          WEATHER_API_KEY: ""
          MAPS_API_KEY: ""

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      # `tsc -b` (not `tsc --noEmit`): the root tsconfig has no files of its own,
      # so a plain `--noEmit` run type-checks nothing at all. Build mode follows
      # the project references, which now include the E2E/Playwright project.
      - name: Type check (app + node + e2e)
        run: npx tsc -b
      - name: Store behaviour checks
        run: npm run check:store
      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t coupletrip-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t coupletrip-frontend:ci ./frontend
